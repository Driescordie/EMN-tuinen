<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact – EMN Tuinen</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />

<style>
:root {
  --bg-main: #f2f3ef;
  --bg-section: #ffffff;
  --green-dark: #2e4734;
  --green-soft: #7f9b74;
  --earth-brown: #8b6a45;
  --text-main: #1f2a22;
  --text-muted: #5e6a61;
  --border-soft: #dde3db;
  --shadow-soft: 0 14px 40px rgba(0,0,0,.12);
  --shadow-card: 0 6px 20px rgba(0,0,0,.08);
  --radius-lg: 22px;
  --radius-md: 14px;
  --max-width: 1120px;
}

/* Global */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Inter", system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); line-height: 1.6; overflow-x: hidden; }
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }
.container { max-width: var(--max-width); margin: 0 auto; padding: 0 1.5rem; }

/* Header/Navbar */
header { background: var(--bg-section); border-bottom: 1px solid var(--border-soft); position: sticky; top: 0; z-index: 50; transition: 0.3s; }
header.scrolled { background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); box-shadow: 0 6px 20px rgba(0,0,0,0.08); }

.nav { display: flex; justify-content: space-between; align-items: center; padding: 1.2rem 0; gap: 1rem; position: relative; }
.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-logo { width: 42px; height: 42px; border-radius: 12px; overflow: hidden; }
.brand-name { font-size: 0.9rem; font-weight: 600; text-transform: uppercase; }
.brand-tagline { font-size: 0.75rem; color: var(--text-muted); }

/* Nav Links */
.nav-links-container { display: flex; align-items: center; gap: 1.5rem; transition: right 0.3s ease; }
.nav-links { display: flex; gap: 1.5rem; font-size: 0.85rem; color: var(--text-muted); }
.nav-links a { position: relative; padding-bottom: 4px; }
.nav-links a::after { content: ""; position: absolute; left: 0; bottom: 0; width: 0; height: 2px; background: linear-gradient(90deg, var(--green-soft), var(--earth-brown)); transition: width 0.3s ease; }
.nav-links a:hover::after { width: 100%; }

/* Buttons */
.btn { padding: 0.55rem 1.4rem; font-size: 0.8rem; border-radius: 999px; cursor: pointer; border: none; white-space: nowrap; background: var(--green-dark); color: #fff; box-shadow: 0 3px 7px rgba(0,0,0,0.15); transition: 0.25s; }
.btn-primary { background: linear-gradient(135deg, #2e4734, #5f7f56); color: #fff; box-shadow: 0 3px 8px rgba(46,71,52,0.5); }
.btn-primary:hover { background: linear-gradient(135deg, #243a2a, #4f6d48); box-shadow: 0 6px 15px rgba(36,58,42,0.7); }

/* Hamburger menu */
.hamburger { display: none; flex-direction: column; justify-content: space-between; width: 24px; height: 18px; background: none; border: none; cursor: pointer; padding: 0; }
.hamburger span { display: block; height: 3px; width: 100%; background: var(--green-dark); border-radius: 2px; transition: 0.3s; }
.hamburger.open span:nth-child(1) { transform: rotate(45deg) translateY(7px); }
.hamburger.open span:nth-child(2) { opacity: 0; }
.hamburger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-7px); }

/* Headings */
h1,h2,h3 { font-family: "Playfair Display", serif; color: var(--green-dark); margin-bottom: 0.5rem; }
h1 { font-size: clamp(2.5rem, 4vw, 3.5rem); text-align: center; margin-bottom: 3rem; }

/* Contact Section */
.contact-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 2.5rem; margin-top: 2rem; }
.contact-form { background: var(--bg-section); padding: 2rem; border-radius: var(--radius-lg); box-shadow: var(--shadow-card); display: flex; flex-direction: column; gap: 1rem; }
.contact-form input, .contact-form textarea { width: 100%; padding: 0.7rem; border-radius: 12px; border: 1px solid var(--border-soft); font-family: inherit; resize: none; transition: border-color 0.3s ease; }
.contact-form input:focus, .contact-form textarea:focus { outline: none; border-color: var(--green-soft); box-shadow: 0 0 5px var(--green-soft); }
.contact-form button { align-self: flex-start; }

.contact-info { background: linear-gradient(135deg, #f5f7f2, #e6ded3); border-radius: var(--radius-lg); padding: 2rem; display: flex; flex-direction: column; gap: 1rem; font-size: 0.9rem; color: var(--green-dark); }
.contact-info a { color: var(--earth-brown); font-weight: 600; transition: color 0.25s ease; }
.contact-info a:hover { color: var(--green-dark); }

/* Footer */
footer { border-top: 1px solid var(--border-soft); padding: 2rem 0; font-size: 0.8rem; color: var(--text-muted); background: var(--bg-section); text-align: center; user-select: none; }

/* Mobile responsiveness */
@media (max-width: 900px) {
  .hamburger { display: flex; }
  .nav-links-container { 
    position: fixed; top: 0; right: -100%; height: 100vh; width: 250px; 
    background: var(--bg-section); flex-direction: column; align-items: flex-start; 
    padding: 5rem 1.5rem; gap: 2rem; box-shadow: -4px 0 12px rgba(0,0,0,0.1); 
    transition: right 0.3s ease; z-index: 100; 
  }
  .nav-links-container.open { right: 0; }
  .nav-links { flex-direction: column; width: 100%; }
  .nav-links a { font-size: 1.1rem; }
  .btn.btn-primary { width: 100%; text-align: center; }

  .contact-grid { grid-template-columns: 1fr; gap: 1.5rem; }
}
</style>
</head>
<body>
<header>
  <div class="container">
    <nav class="nav">
      <div class="brand">
        <div class="brand-logo"><img src="img/logo.png" alt="EMN Tuinen"></div>
        <div>
          <div class="brand-name">EMN Tuinen</div>
          <div class="brand-tagline">Tuinontwerp • Aanleg • Onderhoud</div
